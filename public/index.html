<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Şamdan Menü</title>
    <link rel="stylesheet" href="app.css">
    <style>
        .page { display: none; }
        .page.active { display: block; }
        
        /* Language Selection Screen */
        #page-lang {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .lang-container {
            max-width: 350px;
            width: 100%;
        }
        .lang-button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid var(--border-color, #333);
            background: var(--card-bg, #1e1e1e);
            color: var(--text-color, #fff);
            transition: border-color 0.2s;
        }
        .lang-button:hover {
            border-color: var(--accent-color, #d4af37);
        }

        /* Top Header Bar */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg, #1e1e1e);
            border-bottom: 1px solid var(--border-color, #333);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-arrow {
            background: none;
            border: none;
            color: inherit;
            font-size: 24px;
            cursor: pointer;
            display: none; /* hidden on language screen */
            padding: 0;
            line-height: 1;
        }
        .brand-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .lang-select-box {
            background: transparent;
            color: inherit;
            border: 1px solid var(--border-color, #333);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Main Menu View (Categories & Dropdown Products) */
        .menu-wrapper {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
        }
        .category-accordion {
            background: var(--card-bg, #1e1e1e);
            border: 1px solid var(--border-color, #333);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .category-bar {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 17px;
        }
        .category-bar::after {
            content: '▼';
            font-size: 12px;
            opacity: 0.7;
            transition: transform 0.3s ease;
        }
        .category-accordion.open .category-bar::after {
            transform: rotate(180deg);
        }
        .products-dropdown {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: rgba(0, 0, 0, 0.15);
            border-top: 0px solid var(--border-color, #333);
        }
        .category-accordion.open .products-dropdown {
            max-height: 2500px;
            border-top-width: 1px;
        }
        
        /* Product Row */
        .product-card {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 15px;
        }
        .product-card:last-child {
            border-bottom: none;
        }
        .product-info {
            flex: 1;
        }
        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .product-desc {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 6px;
        }
        .product-price {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-color, #d4af37);
        }
        .product-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            border: 1px solid var(--border-color, #333);
        }

        /* Lightbox Modal for Photo Zoom */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
        }
        #modalImg {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #closeModal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- TOP FIXED HEADER -->
    <header class="top-header">
        <div class="header-left">
            <button id="backArrowBtn" class="back-arrow" onclick="goBackToLang()" title="Geri">‹</button>
            <span class="brand-title">CAFE ŞAMDAN</span>
        </div>
        <div>
            <select id="globalLangSelect" class="lang-select-box" onchange="onLangChange(this.value)">
                <option value="tr">TR</option>
                <option value="en">EN</option>
                <option value="ar">AR</option>
            </select>
        </div>
    </header>

    <!-- PAGE 1: LANGUAGE SELECTION SCREEN -->
    <div id="page-lang" class="page active">
        <div class="lang-container">
            <h1 style="margin-bottom: 10px; font-size: 28px;">Cafe Şamdan</h1>
            <p style="margin-bottom: 30px; opacity: 0.7;">Lütfen dil seçiniz / Please select language</p>
            <button class="lang-button" onclick="selectLanguage('tr')">Türkçe</button>
            <button class="lang-button" onclick="selectLanguage('en')">English</button>
            <button class="lang-button" onclick="selectLanguage('ar')">العربية</button>
        </div>
    </div>

    <!-- PAGE 2: CATEGORY LIST WITH DROPDOWN PRODUCTS -->
    <div id="page-menu" class="page">
        <div class="menu-wrapper">
            <h2 id="menuHeading" style="margin-bottom: 20px; font-size: 22px;">Kategoriler</h2>
            <div id="categoriesListContainer">
                <!-- Dynamically loaded categories and products -->
            </div>
        </div>
    </div>

    <!-- PHOTO LIGHTBOX MODAL -->
    <div id="imageModal" onclick="closeImageModal()">
        <span id="closeModal">&times;</span>
        <img id="modalImg" src="" alt="Büyük Görsel">
    </div>

    <!-- MAIN APP SCRIPT -->
    <script src="app.js"></script>
</body>
</html>
